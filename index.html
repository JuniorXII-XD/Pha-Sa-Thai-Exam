</style></head><body><main class="wrap"><header class="top"><div><div class="brand">THAI / A-LEVEL</div><div class="sub">แบบฝึกหัดภาษาไทย · 5 ข้อ</div></div><div class="counter" id="counter"></div></header><div class="progress" id="progress"></div><div id="app"></div><nav class="nav"><button class="btn secondary" id="prev">← ย้อนกลับ</button><button class="btn secondary" id="next">หน้าถัดไป →</button></nav><div class="footer">โจทย์เรียบเรียงขึ้นใหม่ตามแนว A-Level ภาษาไทย</div></main><script>const questions=[{"topic": "ชนิดของคำในภาษาไทย", "stem": "ข้อใดมีคำว่า “ที่” ทำหน้าที่เป็นคำบุพบท", "opts": ["นักเรียนที่ตั้งใจเรียนย่อมประสบความสำเร็จ", "คุณแม่ทำงานอยู่ที่โรงพยาบาล", "หนังสือที่ฉันซื้อมาอ่านสนุกมาก", "คนที่ยืนอยู่ตรงนั้นคือคุณครู", "สิ่งที่เขาพูดเป็นความจริง"], "ans": 1, "keys": ["คำว่า “ที่”", "คำบุพบท", "หน้าที่ของคำ"], "question": "โจทย์ไม่ได้ถามความหมายของคำว่า “ที่” แต่ถามว่าคำนี้ทำหน้าที่เป็นคำบุพบทในประโยคใด", "steps": ["หาคำว่า “ที่” ในแต่ละตัวเลือก", "ตรวจว่าคำหลัง “ที่” เป็นสถานที่หรือเป็นข้อความขยายคำนาม", "เลือกประโยคที่ “ที่” เชื่อมกริยากับสถานที่"], "why": ["“ที่ตั้งใจเรียน” เป็นอนุประโยคขยาย “นักเรียน” ไม่ได้บอกสถานที่", "“ที่โรงพยาบาล” ระบุสถานที่ของการทำงาน คำว่า “ที่” จึงเป็นคำบุพบท", "“ที่ฉันซื้อมา” ขยาย “หนังสือ” ว่าเป็นหนังสือเล่มใด", "“ที่ยืนอยู่ตรงนั้น” ขยาย “คน” ว่าเป็นคนใด", "“ที่เขาพูด” ขยาย “สิ่ง” ว่าเป็นสิ่งใด"], "tip": "อย่าตัดสินชนิดของคำจากรูปร่างคำเพียงอย่างเดียว ให้ดูหน้าที่ในประโยค"}, {"topic": "ระดับภาษา", "stem": "ข้อความต่อไปนี้ใช้ภาษาระดับใด", "passage": "สำนักงานเขตพื้นที่การศึกษาขอแจ้งให้สถานศึกษาทุกแห่งดำเนินการจัดส่งรายงานผลการดำเนินงานภายในระยะเวลาที่กำหนด", "opts": ["ภาษาระดับกันเอง", "ภาษาระดับไม่เป็นทางการ", "ภาษาระดับกึ่งทางการ", "ภาษาระดับทางการ", "ภาษาระดับพิธีการ"], "ans": 3, "keys": ["ใช้ภาษาระดับใด", "สำนักงานเขตพื้นที่การศึกษา", "ดำเนินการ / จัดส่งรายงาน"], "question": "โจทย์ต้องการให้จำแนกระดับภาษาจากสถานการณ์ ผู้ส่งสาร ผู้รับสาร และถ้อยคำที่ใช้", "steps": ["ระบุผู้ส่งสาร: หน่วยงานด้านการศึกษา", "ดูวัตถุประส ที่ครอบคลุมทั้งสิ่งแวดล้อมและคุณภาพชีวิต"], "why": ["ความสวยงามไม่ได้เป็นสาระที่ข้อความเน้น และครอบคลุมประโยชน์ไม่ครบ", "ครอบคลุมทุกเหตุผลทั้งด้านสิ่งแวดล้อมและคุณภาพชีวิต จึงเป็นใจความสำคัญ", "เป็นคำแนะนำใหม่เรื่องออกกำลังกายทุกวัน ไม่ใช่สาระหลักของข้อความ", "ข้อความไม่ได้เปรียบเทียบเมืองกับชนบท และคำว่า “ทุกแห่ง” เกินข้อมูล", "คำว่า “วิธีเดียว” เกินจริง และข้อความไม่ได้อ้างว่าปลูกต้นไม้แก้มลพิษได้เพียงวิธีเดียว"], "tip": "ใจความสำคัญต้องครอบคลุมเนื้อหาทั้งย่อหน้า ไม่แคบเกินไป และไม่เติมความเห็นใหม่"}];const letters=['ก','ข','ค','ง','จ'];let page=0;const state=questions.map(()=>({choice:null,submitted:false,stage:0}));const app=document.getElementById('app');function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(n){page=Math.max(0,Math.min(6,n));render();window.scrollTo({top:0,behavior:'smooth'})}function select(i){if(state[page-1].submitted)return;state[page-1].choice=i;render()}function submit(){const s=state[page-1];if(s.choice===null)return;s.submitted=true;s.stage=3;render();setTimeout(()=>document.getElementById('lesson')?.scrollIntoView({behavior:'smooth',block:'start'}),180)}function advance(){const s=state[page-1];s.stage=Math.min(3,s.stage+1);render();document.getElementById('lesson')?.scrollIntoView({behavior:'smooth',block:'start'})}function reset(){state[page-1]={choice:null,submitted:false,stage:0};render()}function render(){document.getElementById('counter').textContent=page===0?'เริ่มต้น':page===6?'จบบทเรียน':`ข้อ ${page} / 5`;document.getElementById('progress').innerHTML=questions.map((_,i)=>`<div class="pip ${page>i?'on':''}"></div>`).join('');document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===6;if(page===6){app.innerHTML=`<section class="endpage"><div class="endmark">✓</div><span class="tag">END OF LESSON</span><h1>จบบทเรียน</h1><p class="lead">ฝึกวิเคราะห์โจทย์ · เปรียบเทียบตัวเลือก · ตัดช้อยส์อย่างมีเหตุผล</p><div class="credit"><div class="sub">จัดทำโดย</div><h2>นายพิชญ ชำนิ</h2><div class="creditno">เลขที่ 6</div></div><button class="btn secondary" onclick="go(0)">กลับหน้าแรก ↗</button></section>`;return}if(page===0){app.innerHTML=`<section class="cover"><span class="tag">A-LEVEL THAI · PRACTICE</span><h1>อ่านให้เข้าใจ<br><span style="color:var(--cyan)">คิดก่อนเลือก</span></h1><p class="lead">5 ข้อ · 5 ทักษะภาษาไทย<br>เลือกตอบ แล้วเลื่อนลงเพื่อเรียนรู้วิธีคิด</p><div class="card intro"><div class="introline"><span>01</span> เลือกคำตอบ</div><div class="introline"><span>02</span> เปิดเฉลย</div><div class="introline"><span>03</span> เลื่อนอ่านบทวิเคราะห์</div><button class="btn" onclick="go(1)">เริ่มทำข้อสอบ →</button></div></section>`;return}const q=questions[page-1],s=state[page-1];let h=`<span class="tag">QUESTION ${String(page).padStart(2,'0')} / 05</span><h1>${escapeHTML(q.topic)}</h1><div class="card"><div class="sub">โจทย์</div><div class="question">${escapeHTML(q.stem)}</div>${q.passage?`<div class="passage">“${escapeHTML(q.passage)}”</div>`:''}${q.opts.map((o,i)=>`<button class="option ${s.choice===i?'chosen':''} ${s.submitted&&i===q.ans?'correct':''} ${s.submitted&&s.choice===i&&i!==q.ans?'wrong':''}" ${s.submitted?'disabled':''} onclick="select(${i})"><span class="letter">${letters[i]}</span><span>${escapeHTML(o)}</span></button>`).join('')}${!s.submitted?`<div class="actions"><button class="btn" onclick="submit()" ${s.choice===null?'disabled':''}>ดูเฉลยและวิธีคิด ↓</button></div>`:`<div class="result ${s.choice===q.ans?'':'bad'}"><strong>${s.choice===q.ans?'✓ ตอบถูกต้อง':'✕ ยังไม่ถูกต้อง'}</strong><div>เฉลยข้อ ${letters[q.ans]}. ${escapeHTML(q.opts[q.ans])}</div></div><div class="actions"><button class="btn secondary" onclick="reset()">ลองตอบใหม่</button></div>`}</div>`;if(s.submitted){h+=`<div id="lesson" class="lesson-flow"><div class="flow-intro reveal"><span class="tag">SCROLL TO LEARN</span><h2>ทำไมข้อนี้ถึงตอบ ${letters[q.ans]}?</h2><p class="muted">เลื่อนลงเพื่อดูวิธีคิดและตัดตัวเลือกทีละส่วน</p><div class="scroll-mark">↓</div></div><div class="flow-line"></div>`;if(s.stage>=1){h+=`<section class="flow-section reveal"><span class="flow-label">01 — READ</span><h2>วิเคราะห์โจทย์</h2><p>${escapeHTML(q.question)}</p><h3>คีย์เวิร์ดสำคัญ</h3>${q.keys.map(k=>`<span class="keyword">${escapeHTML(k)}</span>`).join('')}<h3>กระบวนการคิด</h3>${q.steps.map((st,i)=>`<div class="step reveal"><span class="num">0${i+1}</span><span>${escapeHTML(st)}</span></div>`).join('')}</section>`}if(s.stage>=2){h+=`<section class="flow-section reveal"><span class="flow-label">02 — ELIMINATE</span><h2>วิเคราะห์ช้อยส์และตัดตัวลวง</h2>${q.opts.map((o,i)=>`<div class="review reveal ${i===q.ans?'good':''}"><div class="head">${i===q.ans?'✓ เก็บไว้':'✕ ตัดออก'} · ${letters[i]}. ${escapeHTML(o)}</div><div>${escapeHTML(q.why[i])}</div></div>`).join('')}</section>`}if(s.stage>=3){h+=`<section class="flow-section reveal"><span class="flow-label">03 — REMEMBER</span><h2>สรุปวิธีจำไปสอบ</h2><div class="tip">✦ ${escapeHTML(q.tip)}</div><div class="actions"><button class="btn" onclick="go(${Math.min(6,page+1)})">${page===5?'ดูหน้าผู้จัดทำ →':'ไปข้อถัดไป →'}</button></div></section>`}if(s.stage<3){h+=`<div class="actions"><button class="btn" onclick="advance()">${['เริ่มวิเคราะห์โจทย์ →','วิเคราะห์ช้อยส์ / ตัดตัวลวง →','ดูเทคนิคสรุป →'][s.stage]}</button></div>`}h+='</div>'}app.innerHTML=h;observeReveals()}function observeReveals(){const els=document.querySelectorAll('.reveal');if(!('IntersectionObserver' in window)){els.forEach(el=>el.classList.add('visible'));return}const io=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -30px 0px'});els.forEach(el=>io.observe(el))}document.getElementById('prev').onclick=()=>go(page-1);document.getElementById('next').onclick=()=>go(page+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&e.target.tagName!=='BUTTON')go(page+1);if(e.key==='ArrowLeft'&&e.target.tagName!=='BUTTON')go(page-1)});render();</script></body></html>
